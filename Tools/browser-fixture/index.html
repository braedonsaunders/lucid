<!doctype html><html><meta charset="utf-8"><title>Lucid Frontier Playback Test</title><style>body{margin:0;background:#080b10;color:white;font:16px -apple-system}video{display:block;width:100%;max-width:1280px;margin:70px auto}p{margin:20px}</style><p>Lucid · isolated playback verification</p><video controls autoplay muted loop src="video.mp4"></video><script src="runtime-harness.js"></script><script src="stream-policy.js"></script><script src="content.js"></script><script>window.statuses=[];fetch('http://127.0.0.1:47912/token').then(r=>r.text()).then(token=>{let ws=window.controlSocket=new WebSocket('ws://127.0.0.1:47911');ws.onopen=()=>ws.send(JSON.stringify({type:'hello',token:token.trim()}));ws.onmessage=e=>{try{let m=JSON.parse(e.data);if(m.type==='status'){window.latestStatus=m;statuses.push(m);if(statuses.length>60)statuses.shift()}}catch{}};});</script></html>
