<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The surface Lucid draws into.

  This runs at the extension's own origin inside an iframe the content script
  places over the video. That matters: a page's Content-Security-Policy applies
  to its content scripts as well as to the page itself, and most large sites
  forbid connecting to ws://127.0.0.1 - so a canvas in the page cannot receive
  enhanced frames from the app. This document is not bound by the page's policy,
  so it can hold the socket itself. The iframe still lives in the page's DOM, so
  it scrolls, clips and stacks exactly like the canvas did.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  /* surfaceGL is shown instead of surface only while the WebGL2 final-stretch
     path is actually active; see surface.js. Starts hidden so the 2D canvas
     (today's shipping path) is what paints until/unless GL takes over. */
  #surfaceGL { display: none; }
</style>
</head>
<body>
<canvas id="surface"></canvas>
<canvas id="surfaceGL"></canvas>
<script src="bridge-auth.js"></script>
<script src="surface.js"></script>
</body>
</html>
