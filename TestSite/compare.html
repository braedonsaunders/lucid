<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucid — eyes-first comparison</title>
<style>
  :root { --bg:#0b0e14; --panel:#141923; --line:#232a38; --text:#e6ebf5; --muted:#8b94a7;
          --accent:#5b8cff; --good:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif; overflow:hidden; }
  header { height:46px; display:flex; align-items:center; gap:16px; padding:0 16px;
    background:rgba(11,14,20,.94); border-bottom:1px solid var(--line); }
  h1 { font-size:14px; margin:0; font-weight:640; letter-spacing:-.01em; }
  header a { color:var(--muted); font-size:12px; text-decoration:none; }
  header a:hover { color:var(--text); }
  .hint { color:var(--muted); font-size:11.5px; margin-left:auto; }
  kbd { background:#1b2230; border:1px solid var(--line); border-radius:4px; padding:1px 5px;
    font-family:ui-monospace,monospace; font-size:10.5px; }
  main { display:grid; grid-template-columns:250px 1fr; height:calc(100% - 46px); }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:10px; }
  .group { color:var(--muted); font-size:10px; letter-spacing:.7px; text-transform:uppercase;
    margin:12px 0 5px; font-weight:600; }
  .variant { display:flex; align-items:baseline; gap:7px; width:100%; text-align:left;
    background:transparent; color:var(--text); border:1px solid transparent; border-radius:7px;
    padding:6px 8px; font:inherit; font-size:12.5px; cursor:pointer; }
  .variant:hover { background:#1b2230; }
  .variant.on { background:rgba(91,140,255,.16); border-color:var(--accent); }
  .variant .n { color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; width:11px; }
  .variant .m { margin-left:auto; font-size:10.5px; font-variant-numeric:tabular-nums; color:var(--muted); }
  .variant.win .m { color:var(--good); }
  .variant.lose .m { color:var(--bad); }
  select { width:100%; background:#1b2230; color:var(--text); border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; font:inherit; font-size:12.5px; }
  .stage { position:relative; overflow:hidden; background:#07090d; cursor:grab; }
  .stage.drag { cursor:grabbing; }
  .stage img { position:absolute; image-rendering:pixelated; transform-origin:0 0;
    user-select:none; -webkit-user-drag:none; }
  .stage img.smooth { image-rendering:auto; }
  .stage img.hide { visibility:hidden; }
  .bar { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:14px;
    padding:9px 14px; background:linear-gradient(transparent,rgba(7,9,13,.92)); font-size:12px; }
  .bar b { font-weight:600; }
  .bar .m { color:var(--muted); font-variant-numeric:tabular-nums; font-size:11.5px; }
  .bar .good { color:var(--good); } .bar .bad { color:var(--bad); }
  .zoom { position:absolute; top:10px; right:12px; display:flex; gap:5px; }
  .zoom button { background:rgba(20,25,35,.9); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:3px 9px; font:inherit; font-size:11.5px; cursor:pointer; }
  .zoom button.on { border-color:var(--accent); background:rgba(91,140,255,.2); }
  .note { color:var(--muted); font-size:11px; margin-top:14px; line-height:1.4; }
</style>
</head>
<body>
<header>
  <h1>Eyes-first comparison</h1>
  <a href="lab.html">← live lab</a>
  <span class="m" id="frameLabel" style="color:var(--muted);font-size:12px"></span>
  <span class="hint">
    <kbd>1</kbd>–<kbd>9</kbd> variant · <kbd>Space</kbd> flip to shipping · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>S</kbd> smooth/pixel · drag to pan · wheel to zoom
  </span>
</header>
<main>
  <aside>
    <div class="group">Frame</div>
    <select id="frames"></select>
    <div id="list"></div>
    <div class="note" id="note"></div>
  </aside>
  <div class="stage" id="stage">
    <div class="zoom" id="zoom"></div>
    <div class="bar" id="bar"></div>
  </div>
</main>
<script>
const stage = document.getElementById('stage');
const list = document.getElementById('list');
const bar = document.getElementById('bar');
const zoomBox = document.getElementById('zoom');
const frameLabel = document.getElementById('frameLabel');
const frameSelect = document.getElementById('frames');
const note = document.getElementById('note');

let manifest = null, frame = 0, variant = 0, previous = 0;
let zoom = 0, panX = 0, panY = 0, smooth = false;
const images = new Map();

const GROUPS = [
  ['Truth and source', ['reference', 'source']],
  ['Today: shipping Lucid', ['shipping', 'shipping_app', 'lanczos']],
  ['Candidate: Lucid 2k', ['lucid_2k', 'lucid_2k_app', 'lucid_2k_raw']],
  ['Target: NVIDIA RTX VSR (VFX SDK ULTRA on the 4080)', ['nvidia_ultra', 'nvidia_high']],
  ['Other', null],
];
const NAMES = {
  reference: 'reference (1080p master → 720p)', source: 'source (640×360 as decoded)',
  lanczos: 'Lanczos', shipping: 'shipping weights', shipping_app: 'shipping, through the app',
  lucid_2k: 'Lucid 2k blend (candidate)', lucid_2k_app: 'Lucid 2k blend, through the app', lucid_2k_raw: 'Lucid 2k raw checkpoint',
  nvidia_ultra: 'NVIDIA ULTRA', nvidia_high: 'NVIDIA HIGH',
};
const pretty = n => NAMES[n] || n;

function currentFrame() { return manifest.frames[frame]; }
function variants() { return currentFrame().variants; }
function indexOf(name) { return variants().findIndex(v => v.name === name); }
function baselineIndex() { const i = indexOf('shipping'); return i < 0 ? 0 : i; }

function preload() {
  for (const v of variants()) {
    const key = currentFrame().id + v.file;
    if (images.has(key)) continue;
    const img = new Image();
    img.src = '../output/compare/' + v.file;
    img.className = 'hide' + (smooth ? ' smooth' : '');
    img.draggable = false;
    img.onload = layout;
    stage.insertBefore(img, zoomBox);
    images.set(key, img);
  }
}

function layout() {
  const v = variants()[variant];
  const img = images.get(currentFrame().id + v.file);
  if (!img || !img.naturalWidth) return;
  for (const other of images.values()) other.classList.add('hide');
  img.classList.remove('hide');
  const scale = zoom === 0
    ? Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight)
    : zoom;
  for (const other of images.values()) {
    other.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    other.classList.toggle('smooth', smooth);
  }
}

function delta(v, key) {
  const b = variants()[baselineIndex()];
  if (!v.metrics || !b.metrics || v === b) return null;
  return 1 - v.metrics[key] / b.metrics[key];
}

function renderList() {
  list.innerHTML = '';
  const all = variants();
  const used = new Set();
  const add = (title, names) => {
    const picks = names
      ? names.map(n => all.findIndex(v => v.name === n)).filter(i => i >= 0)
      : all.map((_, i) => i).filter(i => !used.has(i));
    if (!picks.length) return;
    const heading = document.createElement('div');
    heading.className = 'group'; heading.textContent = title;
    list.append(heading);
    for (const i of picks) {
      used.add(i);
      const v = all[i];
      const d = delta(v, 'dists');
      const button = document.createElement('button');
      button.className = 'variant' + (i === variant ? ' on' : '')
        + (d === null ? '' : d > 0 ? ' win' : ' lose');
      button.innerHTML = `<span class="n">${i + 1}</span><span>${pretty(v.name)}</span>`
        + `<span class="m">${d === null ? '' : (d > 0 ? '+' : '') + (d * 100).toFixed(1) + '% DISTS'}</span>`;
      button.onclick = () => select(i);
      list.append(button);
    }
  };
  for (const [title, names] of GROUPS) add(title, names);
}

function renderBar() {
  const v = variants()[variant];
  const m = v.metrics;
  let text = `<b>${pretty(v.name)}</b>`;
  if (m) {
    text += `<span class="m">LPIPS ${m.lpips.toFixed(4)} · DISTS ${m.dists.toFixed(4)} · fine corr ${m.fine_correlation.toFixed(3)} · fine energy ${m.detail_energy.toFixed(2)} · PSNR ${m.psnr_y.toFixed(2)}</span>`;
    const l = delta(v, 'lpips'), d = delta(v, 'dists');
    if (l !== null) text += `<span class="${l > 0 ? 'good' : 'bad'}">${l > 0 ? '+' : ''}${(l * 100).toFixed(1)}% LPIPS</span>`
      + `<span class="${d > 0 ? 'good' : 'bad'}">${d > 0 ? '+' : ''}${(d * 100).toFixed(1)}% DISTS vs shipping</span>`;
  } else text += `<span class="m">ground truth</span>`;
  bar.innerHTML = text;
}

function select(i) {
  if (i === variant) return;
  previous = variant;
  variant = i;
  renderList(); renderBar(); layout();
}

function setFrame(i) {
  frame = (i + manifest.frames.length) % manifest.frames.length;
  const keep = variants()[Math.min(variant, variants().length - 1)]?.name;
  for (const img of images.values()) img.remove();
  images.clear();
  preload();
  variant = Math.max(0, indexOf(keep));
  frameSelect.value = frame;
  frameLabel.textContent = `${currentFrame().id}`;
  renderList(); renderBar();
  setTimeout(layout, 60);
}

function setZoom(z) {
  zoom = z;
  for (const b of zoomBox.children) b.classList.toggle('on', +b.dataset.z === z);
  layout();
}

for (const [label, value] of [['Fit', 0], ['100%', 1], ['200%', 2], ['300%', 3], ['400%', 4]]) {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.z = value;
  b.onclick = () => setZoom(value);
  zoomBox.append(b);
}

let dragging = false, startX = 0, startY = 0;
stage.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
  stage.classList.add('drag');
});
addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = e.clientX - startX; panY = e.clientY - startY; layout();
});
addEventListener('mouseup', () => { dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const v = variants()[variant];
  const img = images.get(currentFrame().id + v.file);
  if (!img) return;
  const current = zoom === 0 ? Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight) : zoom;
  const next = Math.min(8, Math.max(0.25, current * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * next / current;
  panY = my - (my - panY) * next / current;
  zoom = next;
  for (const b of zoomBox.children) b.classList.toggle('on', false);
  layout();
}, { passive: false });

addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') { const i = +e.key - 1; if (i < variants().length) select(i); }
  else if (e.key === 'ArrowRight') setFrame(frame + 1);
  else if (e.key === 'ArrowLeft') setFrame(frame - 1);
  else if (e.key === 's' || e.key === 'S') { smooth = !smooth; layout(); }
  else if (e.code === 'Space') { e.preventDefault(); select(variant === previous ? baselineIndex() : previous); }
  else return;
});
frameSelect.onchange = () => setFrame(+frameSelect.value);
addEventListener('resize', layout);

fetch('../output/compare/manifest.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    manifest = data;
    manifest.frames.forEach((f, i) => { const o = document.createElement('option'); o.value = i; o.textContent = f.id; frameSelect.append(o); });
    note.textContent = data.note || '';
    setZoom(0); setFrame(0);
    variant = Math.max(0, indexOf('shipping')); renderList(); renderBar(); layout();
  })
  .catch(() => { bar.textContent = 'No comparison yet — run Tools/frontier_eval/build_compare_gallery.py'; });
</script>
</body>
</html>
