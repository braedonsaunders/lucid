<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Lucid — sharper browser video">
  <title>Lucid — sharper browser video</title>
  <defs>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="880" height="200" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="200" fill="#0b0e14"/>

    <!-- Aperture mark: the iris opens continuously, the highlight breathes. -->
    <g transform="translate(74 100)">
      <circle r="52" fill="none" stroke="url(#markGradient)" stroke-width="4" opacity="0.28"/>
      <g fill="url(#markGradient)">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="26s" repeatCount="indefinite"/>
        <path d="M0 -44 L26 -26 L11 -4 Z"/>
        <path d="M38 -16 L44 14 L18 11 Z"/>
        <path d="M29 37 L0 48 L7 22 Z"/>
        <path d="M-32 38 L-44 10 L-17 11 Z"/>
        <path d="M-44 -18 L-21 -38 L-14 -12 Z"/>
      </g>
      <circle r="16" fill="#0b0e14"/>
      <circle r="16" fill="none" stroke="url(#markGradient)" stroke-width="3.5"/>
      <circle cx="-6" cy="-6" r="4" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="156" y="112" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
          font-size="66" font-weight="700" letter-spacing="-2.4" fill="url(#wordGradient)">Lucid</text>
    <circle cx="320" cy="62" r="8.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="158" y="146" font-family="-apple-system, Helvetica, Arial, sans-serif"
          font-size="15" letter-spacing="3.6" fill="#8b94a7">SHARPER BROWSER VIDEO ON APPLE SILICON</text>

    <!-- A light sweep, slow enough to read as a highlight rather than a loop. -->
    <rect x="-140" y="0" width="90" height="200" fill="#ffffff" opacity="0.10">
      <animate attributeName="x" values="-140;980;980" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
